<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis Ventas</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f6f8;color:#171717}header{position:sticky;top:0;background:#111827;color:white;padding:18px 16px 14px;z-index:5}header h1{margin:0;font-size:22px}header small{opacity:.75}.wrap{padding:14px 14px 92px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 5px #0001}.card b{display:block;font-size:20px;margin-top:5px}.muted{color:#6b7280;font-size:13px}.green{color:#07883f}.red{color:#c62828}.orange{color:#b25f00}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 9px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;background:#111827;color:white}.btn.alt{background:#e5e7eb;color:#111827}.btn.good{background:#0b8a45}.btn.warn{background:#b86500}.btn.danger{background:#b91c1c}.btn.small{padding:8px 10px;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.list{display:flex;flex-direction:column;gap:8px}.item{background:white;border-radius:14px;padding:12px 13px}.item .top{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:16px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eef2ff}.field{margin-bottom:10px}.field label{display:block;font-size:13px;color:#4b5563;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;background:white}.field textarea{min-height:70px;resize:vertical}.nav{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;padding:7px 2px;font-size:11px;color:#4b5563}.nav button span{display:block;font-size:20px}.nav button.active{color:#111827;font-weight:800}.screen{display:none}.screen.active{display:block}.empty{text-align:center;color:#6b7280;padding:24px 10px}.fab{position:fixed;right:18px;bottom:82px;width:58px;height:58px;border-radius:50%;border:0;background:#111827;color:white;font-size:28px;box-shadow:0 6px 18px #0004}.summary{background:#111827;color:white;border-radius:18px;padding:16px}.summary .big{font-size:29px;font-weight:800}.divider{height:1px;background:#e5e7eb;margin:10px 0}.right{text-align:right}.hide{display:none}.note{font-size:12px;color:#6b7280;margin-top:4px}</style></head><body><header><h1>Mis Ventas</h1><small>Ventas, stock, deudas y publicaciones</small></header><div class="wrap"><section id="inicio" class="screen active"><div class="summary"><div class="muted" style="color:#cbd5e1">Ventas de hoy</div><div class="big" id="sumVentas">$ 0</div><div class="row" style="margin-top:10px"><div><div class="muted" style="color:#cbd5e1">Beneficio</div><b id="sumBeneficio">$ 0</b></div><div><div class="muted" style="color:#cbd5e1">Cobrado</div><b id="sumCobrado">$ 0</b></div></div></div><div class="cards section"><div class="card"><span class="muted">A cobrar</span><b class="orange" id="sumDeuda">$ 0</b></div><div class="card"><span class="muted">Operaciones hoy</span><b id="sumOps">0</b></div><div class="card"><span class="muted">Productos</span><b id="sumProductos">0</b></div><div class="card"><span class="muted">Stock total</span><b id="sumStock">0</b></div></div><div class="section"><h2>Acciones rápidas</h2><div class="row"><button class="btn good" onclick="show('vender')">+ Registrar venta</button><button class="btn alt" onclick="show('productos')">+ Producto</button></div></div><div class="section"><h2>Últimas ventas</h2><div id="ultimas" class="list"></div></div></section><section id="productos" class="screen"><div class="section"><h2>Nuevo producto</h2><div class="card"><div class="field"><label>Nombre</label><input id="pNombre" placeholder="Ej. Helado chocolate"></div><div class="row"><div class="field"><label>Costo unitario</label><input id="pCosto" type="number" inputmode="decimal" placeholder="0"></div><div class="field"><label>Precio de venta</label><input id="pPrecio" type="number" inputmode="decimal" placeholder="0"></div></div><div class="row"><div class="field"><label>Stock inicial</label><input id="pStock" type="number" inputmode="numeric" placeholder="0"></div><div class="field"><label>Controlar stock</label><select id="pControl"><option value="1">Sí</option><option value="0">No</option></select></div></div><button class="btn" onclick="addProduct()">Guardar producto</button></div></div><div class="section"><h2>Mis productos</h2><div id="listaProductos" class="list"></div></div></section><section id="vender" class="screen"><div class="section"><h2>Registrar venta</h2><div class="card"><div class="field"><label>Producto</label><select id="vProducto" onchange="syncSalePrice()"></select></div><div class="row"><div class="field"><label>Cantidad</label><input id="vCantidad" type="number" value="1" min="1"></div><div class="field"><label>Precio unitario</label><input id="vPrecio" type="number" inputmode="decimal"></div></div><div class="field"><label>Cliente (opcional)</label><input id="vCliente" placeholder="Ej. Juan Pérez"></div><div class="field"><label>¿Cuánto te pagó ahora?</label><input id="vPago" type="number" inputmode="decimal" placeholder="0"></div><div class="field"><label>Forma de pago</label><select id="vMedio"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Permuta</option><option>Mixto</option><option>Otro</option></select></div><div class="field"><label>Nota</label><textarea id="vNota" placeholder="Seña, entrega, permuta, etc."></textarea></div><div id="ventaPreview" class="card" style="background:#f9fafb;margin-bottom:10px"></div><button class="btn good" onclick="addSale()">Guardar venta</button></div></div></section><section id="deudas" class="screen"><div class="section"><h2>Deudas pendientes</h2><div id="listaDeudas" class="list"></div></div></section><section id="publicaciones" class="screen"><div class="section"><h2>Nueva publicación</h2><div class="card"><div class="field"><label>Producto / descripción</label><input id="pubNombre" placeholder="Ej. Bicicleta Venzo"></div><div class="row"><div class="field"><label>Precio</label><input id="pubPrecio" type="number"></div><div class="field"><label>Canal</label><select id="pubCanal"><option>Facebook Marketplace</option><option>WhatsApp</option><option>Instagram</option><option>Otro</option></select></div></div><button class="btn" onclick="addPublication()">Guardar publicación</button></div></div><div class="section"><h2>Publicaciones</h2><div id="listaPubs" class="list"></div></div></section></div><nav class="nav"><button id="nav-inicio" class="active" onclick="show('inicio')"><span>🏠</span>Inicio</button><button id="nav-productos" onclick="show('productos')"><span>📦</span>Productos</button><button id="nav-vender" onclick="show('vender')"><span>💰</span>Vender</button><button id="nav-deudas" onclick="show('deudas')"><span>🧾</span>Deudas</button><button id="nav-publicaciones" onclick="show('publicaciones')"><span>📣</span>Publicaciones</button></nav><script>const KEY='misventas_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],sales:[],payments:[],publications:[]};const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);const today=()=>new Date().toISOString().slice(0,10);const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function show(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+s).classList.add('active');if(s==='vender')fillProductSelect();window.scrollTo(0,0)}function addProduct(){let name=pNombre.value.trim();if(!name)return alert('Poné un nombre');db.products.push({id:id(),name,cost:+pCosto.value||0,price:+pPrecio.value||0,stock:+pStock.value||0,control:pControl.value==='1'});pNombre.value=pCosto.value=pPrecio.value=pStock.value='';save()}function fillProductSelect(){vProducto.innerHTML=db.products.length?db.products.map(p=>`<option value="${p.id}">${p.name}${p.control?' · stock '+p.stock:''}</option>`).join(''):'<option value="">Primero cargá un producto</option>';syncSalePrice()}function syncSalePrice(){let p=db.products.find(x=>x.id===vProducto.value);if(p)vPrecio.value=p.price;preview()}['vCantidad','vPrecio','vPago'].forEach(k=>document.addEventListener('input',e=>{if(e.target.id===k)preview()}));function preview(){let q=+vCantidad.value||1,price=+vPrecio.value||0,pay=+vPago.value||0,p=db.products.find(x=>x.id===vProducto.value),cost=p?(p.cost*q):0,total=q*price,debt=Math.max(total-pay,0);ventaPreview.innerHTML=`<div class="row"><div><span class="muted">Total</span><b>${money(total)}</b></div><div><span class="muted">Beneficio</span><b class="green">${money(total-cost)}</b></div></div><div class="divider"></div><span class="muted">Pendiente: </span><b class="${debt?'orange':'green'}">${money(debt)}</b>`}function addSale(){let p=db.products.find(x=>x.id===vProducto.value);if(!p)return alert('Cargá un producto');let q=Math.max(1,+vCantidad.value||1),price=+vPrecio.value||0,total=q*price,pay=Math.min(Math.max(+vPago.value||0,0),total);if(p.control&&p.stock<q)return alert('No hay stock suficiente');if(p.control)p.stock-=q;let sale={id:id(),date:today(),ts:Date.now(),productId:p.id,productName:p.name,qty:q,unitPrice:price,total,cost:p.cost*q,client:vCliente.value.trim()||'Sin cliente',paid:pay,method:vMedio.value,note:vNota.value.trim()};db.sales.push(sale);if(pay>0)db.payments.push({id:id(),saleId:sale.id,date:today(),amount:pay,method:vMedio.value});vCantidad.value=1;vCliente.value=vPago.value=vNota.value='';save();alert('Venta guardada');show('inicio')}function payDebt(sid){let s=db.sales.find(x=>x.id===sid);let due=s.total-paidFor(s.id);let val=prompt('Saldo pendiente: '+money(due)+'\n¿Cuánto te pagó?');if(val===null)return;let a=Math.min(Math.max(+val||0,0),due);if(!a)return;let method=prompt('Medio de pago:','Efectivo')||'Efectivo';db.payments.push({id:id(),saleId:s.id,date:today(),amount:a,method});save()}function paidFor(sid){return db.payments.filter(p=>p.saleId===sid).reduce((a,b)=>a+b.amount,0)}function addPublication(){let name=pubNombre.value.trim();if(!name)return alert('Poné una descripción');db.publications.push({id:id(),name,price:+pubPrecio.value||0,channel:pubCanal.value,status:'Publicado',date:today()});pubNombre.value=pubPrecio.value='';save()}function togglePub(pid){let p=db.publications.find(x=>x.id===pid);p.status=p.status==='Publicado'?'Reservado':p.status==='Reservado'?'Vendido':'Publicado';save()}function adjustStock(pid){let p=db.products.find(x=>x.id===pid);let v=prompt('Stock actual de '+p.name,p.stock);if(v===null)return;p.stock=Math.max(0,+v||0);save()}function render(){let todays=db.sales.filter(s=>s.date===today()),salesTotal=todays.reduce((a,s)=>a+s.total,0),profit=todays.reduce((a,s)=>a+s.total-s.cost,0),collected=todays.reduce((a,s)=>a+paidFor(s.id),0),debt=db.sales.reduce((a,s)=>a+Math.max(s.total-paidFor(s.id),0),0);sumVentas.textContent=money(salesTotal);sumBeneficio.textContent=money(profit);sumCobrado.textContent=money(collected);sumDeuda.textContent=money(debt);sumOps.textContent=todays.length;sumProductos.textContent=db.products.length;sumStock.textContent=db.products.filter(p=>p.control).reduce((a,p)=>a+p.stock,0);ultimas.innerHTML=db.sales.slice().sort((a,b)=>b.ts-a.ts).slice(0,5).map(s=>`<div class="item"><div class="top"><strong>${s.productName} ×${s.qty}</strong><strong>${money(s.total)}</strong></div><div class="muted">${s.client} · ${s.method}</div><div class="muted">Beneficio ${money(s.total-s.cost)} · Pendiente ${money(Math.max(s.total-paidFor(s.id),0))}</div></div>`).join('')||'<div class="empty">Todavía no registraste ventas.</div>';listaProductos.innerHTML=db.products.map(p=>`<div class="item"><div class="top"><strong>${p.name}</strong><span class="pill">${p.control?'Stock '+p.stock:'Sin stock'}</span></div><div class="muted">Costo ${money(p.cost)} · Venta ${money(p.price)} · Margen ${money(p.price-p.cost)}</div>${p.control?`<div style="margin-top:8px"><button class="btn small alt" onclick="adjustStock('${p.id}')">Ajustar stock</button></div>`:''}</div>`).join('')||'<div class="empty">Cargá tu primer producto.</div>';let debts=db.sales.filter(s=>s.total-paidFor(s.id)>0.01);listaDeudas.innerHTML=debts.map(s=>{let d=s.total-paidFor(s.id);return`<div class="item"><div class="top"><strong>${s.client}</strong><strong class="orange">${money(d)}</strong></div><div class="muted">${s.productName} · Venta ${money(s.total)} · Cobrado ${money(paidFor(s.id))}</div><div style="margin-top:8px"><button class="btn small good" onclick="payDebt('${s.id}')">Registrar cobro</button></div></div>`}).join('')||'<div class="empty">No hay deudas pendientes.</div>';listaPubs.innerHTML=db.publications.map(p=>`<div class="item"><div class="top"><strong>${p.name}</strong><strong>${money(p.price)}</strong></div><div class="muted">${p.channel} · ${p.date}</div><div style="margin-top:8px"><button class="btn small ${p.status==='Vendido'?'good':p.status==='Reservado'?'warn':'alt'}" onclick="togglePub('${p.id}')">${p.status}</button></div></div>`).join('')||'<div class="empty">No hay publicaciones cargadas.</div>';fillProductSelect();preview()}render();</script></body></html>
