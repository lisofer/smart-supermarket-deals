name: Finalize v1.2 branch

on:
  push:
    branches:
      - feat/v12-auto-catalog-strict-promos
    paths:
      - .github/workflows/apply-v12-payload.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v12-auto-catalog-strict-promos
      - name: Remove temporary payload helpers
        run: |
          rm -f .github/workflows/apply-v12-payload.yml
          rm -f .github/workflows/cleanup-v12-payload.yml
          rm -f tools/apply_v12_payload.py
          rm -f tools/v12_payload_*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary v1.2 payload helpers"
          git push origin HEAD:feat/v12-auto-catalog-strict-promos
